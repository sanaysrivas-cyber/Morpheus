name: Morpheus Robot CI

on:
  push:
    branches: [main, solverslib/morpheus-drive]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install required Android SDK packages
        run: sdkmanager 'platforms;android-30' 'build-tools;35.0.0'
      - name: Verify commissioning OpMode
        run: python3 tests/verify_bench.py
      - name: Verify PS5 drive controls
        run: python3 tests/verify_drive.py
      - name: Build FTC Robot Controller
        run: ./gradlew :TeamCode:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Morpheus-RobotController-debug
          path: TeamCode/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
